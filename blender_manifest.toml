schema_version = "1.0.0"

# `id` is the module name Blender imports the add-on under, so it not the
# name of the folder or zip on disk decides whether the import succeeds.
# Keep it a bare lowercase Python identifier: no hyphens, no dots.
id = "arachne"
name = "Arachne"
tagline = "Procedural spider webs with a native GPU tearing solver"
maintainer = "Amsy"
type = "add-on"
version = "4.3.0"
license = ["SPDX:GPL-3.0-or-later"]
website = "https://github.com/alanmsyarif/procedural-cobwebs-generator"
tags = ["Add Mesh", "Physics", "Material"]

# Matches bl_info's `blender` key in __init__.py — keep the two in step.
blender_version_min = "5.2.0"

[build]
paths_exclude_pattern = [
  "__pycache__/",
  "/.git/",
  "/.claude/",
  "/images/",
  "/test_shot.py",
  "*.zip",
]
